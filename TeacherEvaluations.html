<div class="content"><h1>تقييم الطلاب</h1><p>يمكنك تقييم الطلاب في الصفوف والمواد المسندة إليك فقط.</p><div id="evaluationSummary"></div><div id="evaluationList"></div></div>
<script>
function loadTeacherEvaluations(){call('evaluationDashboard',{},function(s){document.getElementById('evaluationSummary').innerHTML='<div class="cards"><div class="card">إجمالي التقييمات: '+s.total+'</div><div class="card">قيد التنفيذ: '+s.inProgress+'</div><div class="card">مرسلة: '+s.submitted+'</div></div>';});call('teacherEvaluationData',{},function(d){var labels={IN_PROGRESS:'قيد التنفيذ',SUBMITTED:'مرسلة',LOCKED:'مغلقة'};var el=document.getElementById('evaluationList');el.innerHTML=d.evaluations.length?'<table style="width:100%;background:#fff"><tr><th>الطالب</th><th>الحالة</th><th>الإجراء</th></tr>'+d.evaluations.map(function(e){var s=d.students.filter(function(x){return String(x.id)===String(e.studentId);})[0]||{};return '<tr><td>'+String(s.name||e.studentId)+'</td><td>'+String(labels[e.status]||e.status)+'</td><td><button onclick="resumeEvaluation(\''+e.id+'\')">استئناف</button></td></tr>';}).join('')+'</table>':'<p>لا توجد تقييمات ضمن نطاقك حاليًا.</p>';});}
function resumeEvaluation(id){call('evaluationGet',{id:id},function(d){alert('نموذج: '+d.form.title+' - عدد المعايير: '+d.criteria.length);});}
</script>
