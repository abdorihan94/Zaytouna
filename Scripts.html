
<script>
function call(action,payload,done){google.script.run.withSuccessHandler(function(r){if(!r.success){alert(r.message);return;}if(done)done(r.data);}).withFailureHandler(function(){alert('حدث خطأ غير متوقع');}).api(action,payload||{});}
function showPage(name){google.script.run.withSuccessHandler(function(html){document.getElementById('content').innerHTML=html;var entities={AcademicYears:'ACADEMIC_YEARS',Grades:'GRADES',Classes:'CLASSES',Students:'STUDENTS',Teachers:'TEACHERS',Subjects:'SUBJECTS',CurriculumUnits:'CURRICULUM_UNITS'};if(name==='Lessons')loadLessons();else if(name==='TeacherWorkspace')loadMyLessons();else if(name==='TeacherEvaluations')loadTeacherEvaluations();else if(name==='EvaluationForms')loadEvaluationForms();else if(entities[name])loadEntity(entities[name]);}).include(name);}
function renderRows(rows){var el=document.getElementById('table');if(!el)return;el.innerHTML=rows.length?'<table style="width:100%;background:#fff;padding:10px"><tbody>'+rows.map(function(r){return '<tr>'+Object.keys(r).slice(0,5).map(function(k){return '<td>'+String(r[k]||'')+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table>':'<p>لا توجد سجلات.</p>';}
function loadEntity(entity){call('list',{entity:entity,query:(document.getElementById('search')||{}).value},renderRows);}
function loadLessons(){call('lessons',{query:(document.getElementById('search')||{}).value,status:(document.getElementById('status')||{}).value},renderRows);}
function renderReportStudents(rows){var el=document.getElementById('reportStudentsTable');if(!el)return;if(!rows||!rows.length){el.innerHTML='<p>لا يوجد طلاب ضمن نطاقك حالياً.</p>';return;}el.innerHTML='<table style="width:100%;background:#fff;padding:10px"><thead><tr><th>الاسم</th><th>الصف</th><th>إجراءات</th></tr></thead><tbody>'+rows.map(function(s){return '<tr><td>'+String(s.name||'')+'</td><td>'+String(s.classId||'')+'</td><td>'+'<button onclick="openStudentReport(\''+s.id+'\')">تقرير الطالب</button>'+'<button onclick="openStudentReportHistory(\''+s.id+'\')">سجل التقارير</button>'+'</td></tr>';}).join('')+'</tbody></table>';}
function loadReportStudents(){call('reportStudents',{query:(document.getElementById('reportStudentSearch')||{}).value},renderReportStudents);}
function openStudentReport(studentId){window.__reportStudentId=studentId;google.script.run.withSuccessHandler(function(html){document.getElementById('content').innerHTML=html;}).include('StudentReport');}
function openStudentReportHistory(studentId){window.__reportStudentId=studentId;google.script.run.withSuccessHandler(function(html){document.getElementById('content').innerHTML=html;}).include('StudentReportHistory');}
function initStudentReportPage(studentId){window.__reportStudentId=studentId;var termSelect=document.getElementById('reportTerm');call('bootstrap',{},function(d){var terms=d.reportTerms||{};if(termSelect)termSelect.innerHTML=Object.keys(terms).map(function(k){return '<option value="'+k+'">'+terms[k]+'</option>';}).join('');});call('list',{entity:'ACADEMIC_YEARS'},function(rows){var el=document.getElementById('reportAcademicYear');if(el)el.innerHTML=(rows||[]).map(function(y){return '<option value="'+y.id+'">'+String(y.name||y.id)+'</option>';}).join('');});}
function renderReportResult(data){var el=document.getElementById('reportResult');if(!el||!data)return;var r=data.report;var s=data.summary||{criteria:[]};var rows=(s.criteria||[]).map(function(c){var value=c.average!=null?c.average:(c.distribution?JSON.stringify(c.distribution):(c.values||[]).join('، '));return '<tr><td>'+String(c.label||'')+'</td><td>'+String(value)+'</td></tr>';}).join('');el.innerHTML='<div class="cards"><div class="card">الإصدار: '+r.version+'</div><div class="card">عدد التقييمات المضمنة: '+r.evaluationCount+'</div><div class="card">الحالة: '+r.status+'</div></div>'+'<table style="width:100%;background:#fff;margin-top:10px"><thead><tr><th>المعيار</th><th>الملخص</th></tr></thead><tbody>'+rows+'</tbody></table>'+'<div class="toolbar"><button onclick="openReportFile(\''+r.id+'\',\'DOCUMENT\')">فتح المستند</button><button onclick="openReportFile(\''+r.id+'\',\'PDF\')">فتح PDF</button></div>';}
function generateStudentReport(regenerate){var payload={studentId:window.__reportStudentId,academicYearId:(document.getElementById('reportAcademicYear')||{}).value,term:(document.getElementById('reportTerm')||{}).value,startDate:(document.getElementById('reportStartDate')||{}).value,endDate:(document.getElementById('reportEndDate')||{}).value};call(regenerate?'reportRegenerate':'reportGenerate',payload,renderReportResult);}
function openReportFile(reportId,type){call('reportGetFile',{reportId:reportId,type:type},function(data){if(data&&data.url)window.open(data.url,'_blank');});}
function loadStudentReportHistory(studentId){window.__reportStudentId=studentId;call('reportHistory',{studentId:studentId},renderStudentReportHistory);}
function renderStudentReportHistory(items){var el=document.getElementById('reportHistoryTable');if(!el)return;if(!items||!items.length){el.innerHTML='<p>لا توجد تقارير سابقة لهذا الطالب.</p>';return;}var labels={ACTIVE:'ساري',SUPERSEDED:'مستبدل بنسخة أحدث',ARCHIVED:'مؤرشف'};el.innerHTML='<table style="width:100%;background:#fff;padding:10px"><thead><tr><th>الإصدار</th><th>الفترة</th><th>الحالة</th><th>عدد التقييمات</th><th>تاريخ التوليد</th><th>إجراءات</th></tr></thead><tbody>'+items.map(function(item){var r=item.report;return '<tr><td>'+r.version+'</td><td>'+String(r.term||'')+'</td><td>'+String(labels[r.status]||r.status)+'</td><td>'+r.evaluationCount+'</td><td>'+String(r.generatedAt||'')+'</td><td>'+'<button onclick="openReportFile(\''+r.id+'\',\'DOCUMENT\')">المستند</button>'+'<button onclick="openReportFile(\''+r.id+'\',\'PDF\')">PDF</button>'+'</td></tr>';}).join('')+'</tbody></table>';}
function boot(){call('bootstrap',{},function(d){document.getElementById('userName').textContent=d.user.name||'';document.getElementById('version').textContent=d.milestone;var roles=d.user.roles||[];var isTeacher=roles.indexOf('TEACHER')>=0||roles.indexOf('ADMIN')>=0;var canDesign=roles.indexOf('EVALUATION')>=0||roles.indexOf('ADMIN')>=0;var canViewReports=isTeacher||roles.indexOf('MANAGEMENT')>=0||roles.indexOf('SUPERVISOR')>=0;document.getElementById('teacherEvaluationsNav').style.display=isTeacher?'block':'none';document.getElementById('evaluationFormsNav').style.display=canDesign?'block':'none';var reportsNav=document.getElementById('studentReportsNav');if(reportsNav)reportsNav.style.display=canViewReports?'block':'none';['STUDENTS','TEACHERS','LESSONS'].forEach(function(e){call('list',{entity:e},function(rows){var id=e==='STUDENTS'?'studentCount':e==='TEACHERS'?'teacherCount':'lessonCount';document.getElementById(id).textContent=rows.length;});});});}
document.addEventListener('DOMContentLoaded',boot);
</script>
