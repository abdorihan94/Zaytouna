
<style>:root{font-family:Arial,sans-serif;color:#1f2937;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}#app{display:flex;min-height:100vh}aside{width:240px;background:#123b5d;color:#fff;padding:20px}main{flex:1}header{background:#fff;padding:18px 28px;border-bottom:1px solid #ddd}.nav button{display:block;width:100%;padding:12px;margin:6px 0;background:transparent;color:#fff;border:0;text-align:right;cursor:pointer}.nav button:hover{background:#1d557d}.content{padding:28px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}.card{background:#fff;padding:20px;border-radius:10px;box-shadow:0 2px 8px #0001}.toolbar{display:flex;gap:8px;margin:15px 0}input,select,button{padding:9px;border:1px solid #ccd3dc;border-radius:6px}button.primary{background:#1677a8;color:#fff;border:0}@media(max-width:700px){aside{width:180px;padding:10px}.content{padding:15px}}</style>
